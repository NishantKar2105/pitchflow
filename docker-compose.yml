services:
  postgres:
    image: postgres:16
    container_name: pitchflow-db
    environment:
      POSTGRES_USER: pitchflow
      POSTGRES_PASSWORD: ${PITCHFLOW_DB_PASSWORD}
      POSTGRES_DB: pitchflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: